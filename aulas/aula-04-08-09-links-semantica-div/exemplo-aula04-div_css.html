<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo div, br e hr</title>

    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        #principal{
            background-color: lightblue;
            border: 2px solid blue;
            color: rgb(255, 0, 187);
        }
        #secundaria{
            background-color: lightgreen;
            border: 2px solid green;
            color: rgb(255, 0, 187);
        }
        hr{
            border: none;
            border-top: 3px solid black;
            width: 80%;
        }
    </style>
    
</head>
<body>
    <div id = "principal">
        Esta é a primeira linha
        <br>
        Esta é a segunda linha
    </div>
    <hr>
    <div id = "secundaria">
        Esta é outra divisão da página.
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>
