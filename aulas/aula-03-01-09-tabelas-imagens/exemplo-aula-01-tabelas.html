<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tabelas</title>

</head>

<body>

    <h1>Tabelas em HTML.</h1>

    <P>As tabelas em HTML são usadas para organizar dados<br>

        em linhas e colunas.

    </P>

    <br>

    <hr>

    <br>

    <table border = '1'>

        <thead>

            <tr>

                <th>Nome</th>

                <th>Idade</th>

                <th>Cidade</th>

            </tr>

        </thead>

        <tbody>

            <tr>

                <td>Paulo Ferreira</td>

                <td>19</td>

                <td>São Paulo</td>

            </tr>

            <tr>

                <td>Gabriel Santos</td>

                <td>21</td>

                <td>Campinas</td>

            </tr>

        </tbody>

    </table>

</body>

</html>
