<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomia das Tags HTML</title>
</head>
<body>
    <h1>Anatomia das Tags</h1>
    <p>
        As Tags HTML são os elementos básicos que compõem uma pagina web.
        Cada Tag tem uma estrutura específica e desempenha um papel importante
        na organização e apresentação do conteúdo.
    </p>
    <p>
        Este é um exemplo de paragrafo que pode conter <strong>texto em negrito</strong> ou <em>texto
        em itálico.</em>
    </p>
</body>
</html>
