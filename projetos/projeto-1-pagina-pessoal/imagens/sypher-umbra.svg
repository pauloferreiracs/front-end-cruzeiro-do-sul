<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Formação da Sypher e Umbra</title>
  <desc id="descricao">Paulo, Gustavo e Alify unem programação, tráfego e programação com IA na Sypher e Umbra.</desc>
  <rect width="960" height="480" rx="24" fill="#e7f0fb"/>
  <text x="480" y="68" fill="#0b1d38" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" text-anchor="middle">Sypher &amp; Umbra</text>
  <text x="480" y="103" fill="#46566c" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">Habilidades que se encontram</text>
  <path d="M180 292h600" stroke="#2262a7" stroke-width="8"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <circle cx="180" cy="292" r="82" fill="#0b1d38"/>
    <text x="180" y="287" fill="#ffffff" font-size="27" font-weight="bold">Paulo</text>
    <text x="180" y="320" fill="#ffffff" font-size="18">programação</text>
    <circle cx="480" cy="292" r="82" fill="#2262a7"/>
    <text x="480" y="287" fill="#ffffff" font-size="27" font-weight="bold">Gustavo</text>
    <text x="480" y="320" fill="#ffffff" font-size="18">tráfego</text>
    <circle cx="780" cy="292" r="82" fill="#0b1d38"/>
    <text x="780" y="287" fill="#ffffff" font-size="27" font-weight="bold">Alify</text>
    <text x="780" y="320" fill="#ffffff" font-size="17">programação e IA</text>
    <text x="480" y="430" fill="#0b1d38" font-size="22">Projetos para negócios locais</text>
  </g>
</svg>
