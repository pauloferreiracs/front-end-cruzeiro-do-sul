<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubra seu caminho no Front-End</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <h1>Descubra seu caminho no Front-End</h1>
        <p>Informe seu nome, escolha uma área e receba uma orientação personalizada.</p>
        <button type="button" id="btnTema" class="botao botao-secundario">Tema escuro</button>
    </header>

    <main class="container">
        <section class="cartao">
            <h2>Seus dados</h2>

            <div class="campo">
                <label for="nome">Seu nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <label for="area">Área de interesse:</label>
                <select id="area">
                    <option value="">Selecione uma área</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                </select>
            </div>

            <button type="button" id="btnGerar" class="botao">Gerar orientação</button>
        </section>

        <section class="cartao">
            <h2>Resultado</h2>
            <p id="mensagem" class="mensagem">Sua orientação aparecerá aqui.</p>
        </section>
    </main>

    <footer class="rodape">
        <p>Projeto 3 - Painel Interativo com JavaScript</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
